[package]
name = "pop-launcher"
version = "1.2.7"
license = "MPL-2.0"
authors = ["Michael Aaron Murphy <michael@mmurphy.dev>"]
description = "Library for writing plugins and frontends for pop-launcher"
repository = "https://github.com/pop-os/launcher"
edition.workspace = true

[workspace]
members = ["bin", "plugins", "service", "toolkit"]
resolver = "3"

[workspace.package]
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tracing = "0.1.44"
dirs = "7"
serde_with = "3.24.0"
futures = "0.3.34"
flume = "0.12.0"
regex = "1.13.1"
ron = "0.12"
tokio = "1.54.1"
tokio-stream = "0.1.19"

[dependencies]
const_format = "0.2.37"
dirs.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_with.workspace = true

[profile.release]
lto = "fat"
panic = "abort"

[dependencies.tokio]
workspace = true
features = ["io-std", "io-util"]

[dependencies.tokio-stream]
workspace = true
features = ["io-util"]

# [patch.crates-io]
# freedesktop-desktop-entry = { path = "../freedesktop-desktop-entry" }

[patch."https://github.com/pop-os/cosmic-protocols"]
"cosmic-client-toolkit" = { git = "https://github.com/pop-os//cosmic-protocols" }
